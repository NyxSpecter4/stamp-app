<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Stamp</title>
<link rel="manifest" href="manifest.json">
<style>
:root { --bg:#111; --card:#1a1a1a; --ink:#f0f0f0; --muted:#888; --amber:#e89a3c; --border:#2a2a2a; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:16px; }
header { padding:16px 20px; display:flex; align-items:center; gap:10px; }
.mark { width:28px; height:28px; border:2px solid var(--amber); border-radius:4px; position:relative; }
.mark:after { content:""; position:absolute; left:4px; top:8px; width:16px; height:2px; background:var(--amber); }
h1 { margin:0; font-size:22px; font-weight:600; }
.tabs { display:flex; border-bottom:1px solid var(--border); }
.tab { flex:1; padding:12px; text-align:center; font-size:13px; color:var(--muted); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; }
.tab.active { color:var(--ink); border-bottom-color:var(--amber); }
main { padding:16px 20px 80px; max-width:520px; margin:0 auto; }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
textarea { width:100%; min-height:100px; padding:12px; border:1px solid var(--border); border-radius:8px; background:#111; color:var(--ink); font:inherit; }
button.primary { background:var(--amber); color:#111; border:none; padding:12px; border-radius:8px; font:inherit; font-weight:600; width:100%; margin-top:8px; cursor:pointer; }
.muted { color:var(--muted); font-size:14px; }
.footer { position:fixed; bottom:0; left:0; right:0; background:#1a1a1a; border-top:1px solid var(--border); padding:10px; text-align:center; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <div class="mark"></div>
  <h1>Stamp</h1>
</header>
<nav class="tabs">
  <button class="tab active" data-tab="stamp">Stamp</button>
  <button class="tab" data-tab="log">Log</button>
  <button class="tab" data-tab="packs">Packs</button>
</nav>
<main id="app"></main>
<div class="footer">No check, no stamp · Offline rule pack</div>
<script src="app.js"></script>
</body>
</html>
